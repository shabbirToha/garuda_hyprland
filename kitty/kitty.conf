include themes/cyberpunk-neon.conf
linux_display_server wayland

font_family 0xProto Nerd Font
font_size 11.8
disable_ligatures never

cursor_shape block
cursor_blink_interval 0
scrollback_lines 12000
scrollback_pager less

mouse_hide_wait 2.0
copy_on_select yes
strip_trailing_spaces smart

background_opacity 0.92
dynamic_background_opacity no
remember_window_size no
resize_debounce_time 0.2

window_padding_width 8
window_border_width 0
window_margin_width 0

repaint_delay 14
input_delay 0
sync_to_monitor no
watch_for_window_resize no
enable_audio_bell no

shell /usr/bin/fish

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

map ctrl+equal change_font_size all +2.0
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4


# -----------------------------------------------------------------------------
# TAB BAR - Enhanced Colorful Configuration
# -----------------------------------------------------------------------------

# Tab bar position and basics
tab_bar_edge bottom
tab_bar_style powerline
tab_bar_min_tabs 2
tab_powerline_style angled

# Tab bar colors
tab_bar_background #1a1b26

# Active tab colors
active_tab_background #7aa2f7
active_tab_foreground #1a1b26
active_tab_font_style bold-italic
active_tab_title_template " 🔏{title}  "

# Inactive tab colors
inactive_tab_background #24283b
inactive_tab_foreground #a9b1d6
inactive_tab_font_style normal

# Tab bar margin and padding
tab_bar_margin_width 2.0
tab_bar_margin_height 0.0 4.0

# More detailed tab template with icons
tab_title_template " {index} {fmt.fg.red} {fmt.fg.default} {title} "

# URL detection
detect_urls yes
url_color #7dcfff
url_style curly

# Tab bar height
tab_bar_margin_height 0.0 6.0
