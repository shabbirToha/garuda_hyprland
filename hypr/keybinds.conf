# =====================================================
# Hyprland Keybindings Configuration (UWSM Fixed)
# =====================================================

# -------------------------------
# Modifier Keys
# -------------------------------
$mainMod = SUPER


# =====================================================
# Application Launchers
# =====================================================

# Terminal (NO UWSM – terminals should stay raw)
bind = $mainMod, Return, exec, kitty
# bind = $mainMod SHIFT, Return, exec, alacritty
bind = SUPER SHIFT, Return, exec, kitty --class kitty-float

# Editors
bind = $mainMod, C, exec, uwsm app -- code
bind = $mainMod, N, exec, kitty -e nvim
bind = $mainMod, S, exec, uwsm app -- subl

# Browser
bind = $mainMod, B, exec, uwsm app -- brave
bind = $mainMod SHIFT, B, exec, [workspace 1] uwsm app -- firedragon

# File Manager
bind = $mainMod, F, exec, uwsm app -- thunar

# Yazi File Manager (terminal app → no uwsm)
bind = $mainMod, Y, exec, kitty -e yazi

# Messaging
bind = $mainMod, T, exec, uwsm app -- Telegram


# =====================================================
# Launchers & System UI
# =====================================================

# App Drawer
bind = SUPER, A, exec, uwsm app -- nwg-drawer -mb 10 -mr 10 -ml 10 -mt 10

# Wofi Launcher
bind = SUPER, space, exec, pkill wofi || uwsm app -- wofi --normal-window --show drun --allow-images

# Power Menu
bind = $mainMod, Escape, exec, uwsm app -- nwgbar

# Lock Screen & Notifications
bind = SUPER SHIFT, L, exec, uwsm app -- hyprlock
bind = SUPER SHIFT, N, exec, swaync-client -t

# Emoji Picker
bind = $mainMod SHIFT, E, exec, uwsm app -- emote

# Clipboard Manager (pipeline → NO uwsm)
bind = SUPER SHIFT, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Reload Hyprland
bind = $mainMod SHIFT, R, exec, hyprctl reload


# =====================================================
# Window Management
# =====================================================

# Kill / Float / Fullscreen
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, V, togglefloating
bind = ALT, Return, fullscreen

# Dwindle Layout
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, J, togglesplit


# =====================================================
# Focus Movement (Vim + Arrows)
# =====================================================

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d


# Move window
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d


# =====================================================
# Workspaces
# =====================================================

# Switch Workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll Workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1


# =====================================================
# Mouse Bindings
# =====================================================

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# =====================================================
# Resize Mode (Submap)
# =====================================================

bind = ALT, R, submap, resize
submap = resize

bind = , h, resizeactive, -20 0
bind = , l, resizeactive,  20 0
bind = , k, resizeactive,   0 -20
bind = , j, resizeactive,   0  20

bind = SHIFT, h, resizeactive, -60 0
bind = SHIFT, l, resizeactive,  60 0
bind = SHIFT, k, resizeactive,   0 -60
bind = SHIFT, j, resizeactive,   0  60

bind = , escape, submap, reset
bind = , return, submap, reset
bind = , mouse:272, submap, reset
submap = reset


# =====================================================
# Media & Hardware Controls
# =====================================================

bind = ,122, exec, pamixer --decrease 5; notify-send "Volume: $(pamixer --get-volume)" -t 500
bind = ,123, exec, pamixer --increase 5; notify-send "Volume: $(pamixer --get-volume)" -t 500
bind = ,121, exec, pamixer --toggle-mute; notify-send "Volume: Toggle-mute" -t 500
bind = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle; notify-send "Mic: Toggle-mute" -t 500

bind = ,232, exec, brightnessctl -c backlight set 5%-
bind = ,233, exec, brightnessctl -c backlight set +5%

bind = ,172, exec, playerctl play-pause
bind = ,171, exec, playerctl next
bind = ,173, exec, playerctl previous

# Capture region -> Edit in Swappy -> Save to file AND copy to clipboard
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f - -o ~/Pictures/Screenshots/screenshot-$(date +'%Y%m%d-%H%M%S').png && wl-copy < ~/Pictures/Screenshots/screenshot-$(date +'%Y%m%d-%H%M%S').png

# Capture Active Window -> Edit in Swappy -> Save to file AND copy to clipboard
bind = ALT, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | swappy -f - -o ~/Pictures/Screenshots/window-$(date +'%Y%m%d-%H%M%S').png && wl-copy < ~/Pictures/Screenshots/window-$(date +'%Y%m%d-%H%M%S').png
bind = CTRL,Print, exec, ~/.config/hypr/scripts/screenshot_display.sh

# =====================================================
# Window / App Switching
# =====================================================

bind = ALT, Tab, cyclenext
bind = SUPER, Tab, exec, uwsm app -- hyprswitch simple


# =====================================================
# Wallpaper
# =====================================================

bind = $mainMod SHIFT, W, exec, killall -9 wpaperd && wpaperd
