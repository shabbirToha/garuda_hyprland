############################
#        SYSTEM SERVICES
############################

# Polkit authentication agent (required for GUI privilege prompts)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Network manager tray
exec-once = nm-applet --indicator

# Notifications
exec-once = swaync


############################
#        DESKTOP UI
############################

# Wallpaper daemon
exec-once = wpaperd

# Status bar
exec-once = waybar


############################
#        TERMINAL SERVER
############################

# Foot terminal server (faster launch)
exec-once = foot --server


############################
#        GTK SETTINGS
############################

exec-once = apply-gsettings


############################
#        CLIPBOARD
############################

# Store text clipboard history
exec-once = wl-paste --type text --watch cliphist store

# Store image clipboard history
exec-once = wl-paste --type image --watch cliphist store


############################
#        HYPR UTILITIES
############################

exec-once = hyprswitch init


############################
#        KDE CONNECT
############################

exec-once = kdeconnect-indicator

