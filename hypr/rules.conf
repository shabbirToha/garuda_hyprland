# Blur rules
blurls = wofi
blurls = thunar
blurls = gtk-layer-shell


# Window rules - float and idle inhibit
windowrule = float on, match:class ^(mpv)$
windowrule = idle_inhibit fullscreen, match:class ^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$

# Brave download dialog rules
windowrule = float on, match:class ^(brave)$ match:title (wants to save)
windowrule = size 764 440, match:class ^(brave)$ match:title (wants to save)
windowrule = center on, match:class ^(brave)$ match:title (wants to save)

# Firefox download dialog rules
windowrule = float on, match:class ^(firefox)$ match:title (Opening|Enter name of file to save to)
windowrule = size 764 440, match:class ^(firefox)$ match:title (Opening|Enter name of file to save to)
windowrule = center on, match:class ^(firefox)$ match:title (Opening|Enter name of file to save to)

# Chromium download dialog rules
windowrule = float on, match:class ^(chromium)$ match:title (Save File|Open File|Save As)
windowrule = size 764 440, match:class ^(chromium)$ match:title (Save File|Open File|Save As)
windowrule = center on, match:class ^(chromium)$ match:title (Save File|Open File|Save As)

# File roller rules
windowrule = float on, match:class ^(org.gnome.FileRoller)$
windowrule = size 764 440, match:class ^(org.gnome.FileRoller)$
windowrule = center on, match:class ^(org.gnome.FileRoller)$

# Thunar dialog rules
windowrule = float on, match:class ^(thunar)$ match:title (Save|Open|Select|File Operation Progress)
windowrule = size 764 540, match:class ^(thunar)$ match:title (Save|Open|Select|File Operation Progress)
windowrule = center on, match:class ^(thunar)$ match:title (Save|Open|Select|File Operation Progress)

# Kitty float rules
windowrule = float on, match:class ^(kitty-float)$
windowrule = size 764 440, match:class ^(kitty-float)$
windowrule = center on, match:class ^(kitty-float)$
