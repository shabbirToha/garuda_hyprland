[manager]
show_hidden = false
show_symlink = true

[preview]
# Enables image previews (Make sure you have a supported terminal like Kitty, 
# WezTerm, or Ghostty, and have 'ueberzugpp' or 'chafa' installed if needed)
max_width = 800
max_height = 800

[opener]
# Define Neovim to open code/text files in the foreground
edit = [
    { run = 'nvim "$@"', block = true, desc = "Open in Neovim" }
]

# Define the browser opener (uses xdg-open for Linux, open for macOS)
web = [
    { run = 'xdg-open "$@"', desc = "Open in Browser" }
]

